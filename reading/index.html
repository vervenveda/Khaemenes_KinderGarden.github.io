<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Read · Khaemenes Kindergarten</title><style>
:root{--ink:#29463d;--muted:#65766f;--font:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:18px/1.5 var(--font);color:var(--ink);background:linear-gradient(180deg,#ffd9eb,#d9ceff 34%,#bfeeff 67%,#cdeecf);background-attachment:fixed}.shell{width:min(940px,calc(100% - 1rem));margin:auto}header{background:rgba(255,255,255,.9);border-bottom:1px solid rgba(40,70,60,.12)}nav{min-height:68px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center}a{text-decoration:none;color:inherit}.navbtn{height:44px;display:grid;place-items:center;border-radius:14px;background:#fff}.book{margin:2rem 0;padding:clamp(1.2rem,5vw,2.5rem);border-radius:32px;background:rgba(255,255,255,.82);box-shadow:0 18px 45px rgba(57,75,95,.15);text-align:center}.cover{width:150px;height:150px;margin:auto;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#fff1a8,#ffcfe3);font-size:5.5rem;border:7px solid #fff}.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b45d83}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05;margin:.5rem 0;color:#356a52}.by{color:var(--muted)}.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin:1rem}.tag{padding:.35rem .65rem;border-radius:999px;background:#fff}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem}.btn{padding:.75rem 1rem;border:0;border-radius:16px;background:#2f9364;color:#fff;font-weight:700}.quiz{margin-top:1.2rem;text-align:left}.q{padding:1rem;margin:.7rem 0;border-radius:22px;background:rgba(255,255,255,.78)}.q h3{margin:.1rem 0 .7rem;font-size:1.15rem}.answers{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}.answer{min-height:54px;border:2px solid transparent;border-radius:16px;background:#fff;font:inherit;cursor:pointer}.answer:hover{border-color:#8b69cc}.answer.good{background:#d8f5c8}.answer.try{background:#ffe0e5}.result{text-align:center;font-size:1.25rem;font-weight:700;margin-top:1rem}.locked{opacity:.55;pointer-events:none}@media(max-width:560px){.answers{grid-template-columns:1fr}.cover{width:120px;height:120px;font-size:4.2rem}}</style></head><body>
<header><div class="shell"><nav><a class="navbtn" href="../today/">←</a><div><strong>Khaemenes Kinder Garden</strong><br><small>Weekly Read</small></div><a class="navbtn" href="../student-profile/">☺</a></nav></div></header>
<main class="shell"><section class="book"><div class="cover" id="icon">📖</div><p class="eyebrow" id="week">Weekly Read</p><h1 id="title">Finding your book…</h1><p class="by" id="by"></p><div class="tags"><span class="tag" id="theme"></span><span class="tag" id="access"></span></div><p id="prompt"></p><div class="actions"><a class="btn" id="read" target="_blank" rel="noopener">📖 Open the book</a></div><div class="quiz" id="quiz"><p class="eyebrow">After the story</p><h2>🌈 Story Bubble Quiz</h2><p>Tap the picture-word answer that feels right. You can try again.</p><div id="questions"></div><p class="result" id="result"></p></div></section></main>
<script src="../assets/khaemenes-family-registry.js"></script><script src="../assets/khaemenes-kinder-mastery-gates.js"></script><script src="../assets/khaemenes-kindergarten-reading-list.js"></script>
<script>(function(){"use strict";const $=x=>document.getElementById(x),R=window.KhaemenesFamilyRegistry,G=window.KhaemenesKinderMasteryGates,L=window.KhaemenesKindergartenReadingList?.weeks||[];function learner(){const l=R?.getLearner?.();return l&&String(l.stage).toLowerCase()==="kindergarten"?l:null}function mastered(){let n=0;if(!G?.formalAccess?.())return n;for(let i=1;i<=36;i++){const r=G.weekMastery(i);if(r?.mastered===true&&Number(r.bestQualifiedPercent||0)>=80)n++;else break}return n}const l=learner(),week=Math.min(36,mastered()+1),b=L.find(x=>x.week===week)||L[0];if(!b)return;$("icon").textContent=b.icon;$("week").textContent="Week "+String(b.week).padStart(2,"0")+" · Weekly Read";$("title").textContent=b.title;$("by").textContent="by "+b.author;$("theme").textContent="🌱 "+b.theme;$("access").textContent=b.access==="public-domain-full-book"?"🏛️ Full public-domain book":"🎬 Authorized read-aloud";$("prompt").textContent="Talk together: "+b.prompt;$("read").href=b.readUrl;const box=$("questions"),answered=new Set;b.quiz.forEach((q,qi)=>{const card=document.createElement("div");card.className="q";const h=document.createElement("h3");h.textContent=(qi+1)+". "+q[0];const a=document.createElement("div");a.className="answers";q[2].forEach(label=>{const bt=document.createElement("button");bt.className="answer";bt.textContent=label;bt.onclick=()=>{if(answered.has(qi))return;if(label===q[1]){bt.classList.add("good");answered.add(qi);[...a.children].forEach(x=>x.classList.add("locked"));if(answered.size===b.quiz.length){$("result").textContent="🌼 Your story garden bloomed! Wonderful listening.";if(l)try{localStorage.setItem("khaemenes_kindergarten_weekly_read_v1:"+encodeURIComponent(l.learnerId)+":"+b.week,JSON.stringify({complete:true,title:b.title,completedAt:new Date().toISOString()}))}catch{}}}else{bt.classList.add("try");setTimeout(()=>bt.classList.remove("try"),700)}};a.append(bt)});card.append(h,a);box.append(card)})})();</script></body></html>
