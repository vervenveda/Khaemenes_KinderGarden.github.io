name: Kindergarten regression
on:
  push:
    branches: [main]
    paths:
      - 'assets/khaemenes-kinder-mastery-gates.js'
      - 'assets/khaemenes-kinder-continuity.js'
      - 'assets/khaemenes-portfolio-scope.js'
      - 'assets/khaemenes-kinder-experience.js'
      - 'portfolio-builder/index.html'
      - 'curriculum/printables/**'
      - 'tests/**'
      - '.github/workflows/kindergarten-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated learner mastery engine
        run: node tests/mastery-regression.cjs
      - name: Test learner-safe legacy continuity migration
        run: node tests/continuity-migration-regression.cjs
      - name: Test learner-scoped portfolio and ownership rules
        run: node tests/portfolio-scope-regression.cjs
      - name: Test family observation storage failure handling
        run: node tests/experience-storage-regression.cjs
      - name: Check all printable packet structures
        run: node tests/printables-regression.cjs
      - name: Check instructional depth for Weeks 31–36
        run: node tests/instructional-depth-week-31-36.cjs
