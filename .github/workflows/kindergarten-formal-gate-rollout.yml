name: Kindergarten Formal Gate Validation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'DEPENDENCY_HARDENING.md'
      - 'scripts/validate-dependency-boundary.mjs'
      - 'scripts/validate-sovereign-mirrors.mjs'
      - 'assets/sovereign-mirror-manifest.json'
      - 'assets/khaemenes-kinder-mastery-gates.js'
      - 'curriculum/**'
      - 'scripts/inject-kindergarten-formal-gates.mjs'
      - 'scripts/validate-kindergarten-mastery-gates.mjs'
      - 'scripts/validate-kindergarten-links.mjs'
      - 'contracts/STOS_DEPLOYMENT_REQUIREMENTS_v1.json'
      - 'scripts/validate-stos-deployment-readiness.mjs'
      - 'scripts/validate-legacy-formal-routes.mjs'
      - '.github/workflows/kindergarten-formal-gate-rollout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'DEPENDENCY_HARDENING.md'
      - 'scripts/validate-dependency-boundary.mjs'
      - 'scripts/validate-sovereign-mirrors.mjs'
      - 'assets/sovereign-mirror-manifest.json'
      - 'assets/khaemenes-kinder-mastery-gates.js'
      - 'curriculum/**'
      - 'scripts/inject-kindergarten-formal-gates.mjs'
      - 'scripts/validate-kindergarten-mastery-gates.mjs'
      - 'scripts/validate-kindergarten-links.mjs'
      - 'scripts/validate-legacy-formal-routes.mjs'
      - '.github/workflows/kindergarten-formal-gate-rollout.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/khaemenes-kinder-mastery-gates.js
          node --check curriculum/assets/app.js
          node --check assets/khaemenes-kinder-experience.js
          node --check assets/khaemenes-kinder-continuity.js
          node --check assets/khaemenes-landing-toolbar.js
          node --check assets/preschool-catalog.js
          node --check assets/khaemenes-profile-bridge.js
      - name: Verify formal route coverage
        run: node scripts/inject-kindergarten-formal-gates.mjs --check
      - name: Validate local HTML links and assets
        run: node scripts/validate-kindergarten-links.mjs
      - name: Validate legacy formal route aliases
        run: node scripts/validate-legacy-formal-routes.mjs
      - name: Classify STOS deployment dependencies (static only)
        run: node scripts/validate-stos-deployment-readiness.mjs
      - name: Validate dependency boundary
        run: node scripts/validate-dependency-boundary.mjs
      - name: Validate sovereign mirror provenance and integrity
        run: node scripts/validate-sovereign-mirrors.mjs
      - name: Validate Academy mastery contract
        run: node scripts/validate-kindergarten-mastery-gates.mjs
      - name: Check whitespace integrity
        run: git diff --check
