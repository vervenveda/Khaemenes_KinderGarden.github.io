name: Kindergarten Formal Gate Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/khaemenes-kinder-mastery-gates.js'
      - 'curriculum/**'
      - 'scripts/inject-kindergarten-formal-gates.mjs'
      - 'scripts/validate-kindergarten-mastery-gates.mjs'
      - '.github/workflows/kindergarten-formal-gate-rollout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/khaemenes-kinder-mastery-gates.js'
      - 'curriculum/**'
      - 'scripts/inject-kindergarten-formal-gates.mjs'
      - 'scripts/validate-kindergarten-mastery-gates.mjs'
      - '.github/workflows/kindergarten-formal-gate-rollout.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check assets/khaemenes-kinder-mastery-gates.js
          node --check curriculum/assets/app.js
      - name: Verify formal route coverage
        run: node scripts/inject-kindergarten-formal-gates.mjs --check
      - name: Validate Academy mastery contract
        run: node scripts/validate-kindergarten-mastery-gates.mjs
      - name: Check whitespace integrity
        run: git diff --check
