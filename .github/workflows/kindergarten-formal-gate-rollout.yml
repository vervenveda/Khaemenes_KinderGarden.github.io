name: Kindergarten Formal Gate Rollout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'assets/khaemenes-kinder-mastery-gates.js'
      - 'curriculum/**'
      - 'scripts/inject-kindergarten-formal-gates.mjs'
      - 'scripts/validate-kindergarten-mastery-gates.mjs'
      - '.github/workflows/kindergarten-formal-gate-rollout.yml'

permissions:
  contents: write

jobs:
  inject-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check assets/khaemenes-kinder-mastery-gates.js
          node --check curriculum/assets/app.js
      - name: Inject fail-closed formal gate
        run: node scripts/inject-kindergarten-formal-gates.mjs
      - name: Verify generated coverage and mastery contract
        run: |
          node scripts/inject-kindergarten-formal-gates.mjs --check
          node scripts/validate-kindergarten-mastery-gates.mjs
          git diff --check
      - name: Commit generated gate coverage
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/lessons curriculum/assessments
          git commit -m "Apply Kindergarten fail-closed formal gate coverage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
