<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy · Kindergarten Social Studies Teacher Tools</title><style>body{margin:0;background:#f5f1e7;color:#23352d;font:400 15px/1.6 "Avenir Next","Segoe UI",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0}.card{background:#fff;border:1px solid #d7dcd7;border-radius:7px;padding:18px;margin:14px 0}.button,button{min-height:40px;padding:8px 12px;border:1px solid #aeb8b2;border-radius:7px;background:#fff;color:#23352d}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7dcd7;padding:7px;text-align:left;vertical-align:top}h1,h2{font-family:Cinzel,Georgia,serif;font-weight:400}.small{color:#68736d;font-size:12.5px}@media print{.noPrint{display:none}}</style></head><body><main class="shell"><div class="actions noPrint"><a class="button" href="index.html">← Student Course</a></div><h1>Khaemenes Academy</h1><h2>Kindergarten Social Studies · Teacher Tools</h2><section class="card"><p><strong>Static-site boundary:</strong> this convenience code is not secure authentication. It inspects the browser's learner-scoped subject record.</p><label>Convenience code <input id="code" type="password"> <button id="open">Open</button></label></section><div id="tools"></div></main><script src="https://vervenveda.com/Khaemenes_Academy.github.io/assets/khaemenes-family-registry.js"></script><script src="khaemenes-kindergarten-subject-context.js"></script><script src="course-data.js"></script><script>
(()=>{const C=window.KHAEMENES_KINDERGARTEN_SOCIAL_STUDIES,M=C.metadata,SUB=window.KhaemenesKindergartenSubjectContext||null,LEGACY=M.storageKey,$=s=>document.querySelector(s);function key(){return SUB?.scopedKey?.()||LEGACY}function load(){try{return JSON.parse(localStorage.getItem(key()))||{students:[]}}catch{return{students:[]}}}function save(db){localStorage.setItem(key(),JSON.stringify(db))}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function ensure(s){s.weeks||={};s.exams||={};s.localization||={statePack:"generic",stateLabel:"",updatedAt:null};for(const k of ["midterm","final"]){s.exams[k]||={best:0,attempts:[]};s.exams[k].reviewStatus??="observed"}for(let w=1;w<=36;w++){s.weeks[w]||={};s.weeks[w].reviewStatus??="observed";s.weeks[w].localizationEvidence??=""}}function review(v,a){return `<select ${a}><option value="observed" ${v==="observed"?"selected":""}>Observed</option><option value="revise" ${v==="revise"?"selected":""}>Revise</option><option value="accepted" ${v==="accepted"?"selected":""}>Accepted</option></select>`}function render(){const db=load();(db.students||[]).forEach(ensure);const cards=(db.students||[]).map(s=>{const mastered=C.weeks.filter(w=>(s.weeks[w.week]?.best||0)>=80).length,accepted=C.weeks.filter(w=>s.weeks[w.week]?.reviewStatus==="accepted").length;const rows=C.weeks.map(w=>{const r=s.weeks[w.week]||{},loc=M.localizationCheckpoints.includes(w.week)?`<textarea data-loc-week="${w.week}" data-student="${s.id}" rows="2">${esc(r.localizationEvidence||"")}</textarea>`:"—";return `<tr><td>${w.week}</td><td>${esc(w.title)}</td><td>${r.best?r.best+"%":"—"}</td><td>${r.attempts?.length||0}</td><td>${esc(((r.artifact||"")+" "+(r.reflection||"")).slice(0,105))}</td><td>${review(r.reviewStatus,`data-review-week="${w.week}" data-student="${s.id}"`)}</td><td>${loc}</td></tr>`}).join("");return `<section class="card"><h2>${esc(s.name)} · ${mastered}/36 objective gates · ${accepted}/36 evidence records accepted</h2><div class="assessmentBanner"><h3>My state / community context</h3><label>Pack <select data-pack="${s.id}"><option value="generic" ${s.localization.statePack==="generic"?"selected":""}>Generic state/local</option><option value="florida" ${s.localization.statePack==="florida"?"selected":""}>Florida</option></select></label> <label>Label <input data-label="${s.id}" value="${esc(s.localization.stateLabel||"")}" placeholder="e.g., Florida · my community"></label> <button data-save-loc="${s.id}">Save context</button></div><div class="assessmentBanner">Midyear evidence review: ${review(s.exams.midterm.reviewStatus,`data-exam-review="midterm" data-student="${s.id}"`)} · Final evidence review: ${review(s.exams.final.reviewStatus,`data-exam-review="final" data-student="${s.id}"`)}</div><table><tr><th>Week</th><th>Topic</th><th>Best</th><th>Attempts</th><th>Observed / Drawn / Oral Evidence</th><th>Review</th><th>Localization Evidence</th></tr>${rows}</table></section>`}).join("");$("#tools").innerHTML=`<section class="card"><div class="actions noPrint"><button id="export">Export JSON</button><label class="button">Import JSON <input id="import" type="file" accept=".json,application/json" style="display:none"></label><button id="print">Print</button></div><p class="small">Observed / revise / accepted is a qualitative evidence record. Teacher read-aloud support remains allowed, and review status never changes the 80% objective mastery gate.</p></section>${cards||'<section class="card">No subject learners stored in this browser/context.</section>'}`;document.querySelectorAll("[data-review-week]").forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.student);ensure(s);s.weeks[el.dataset.reviewWeek].reviewStatus=el.value;save(db)});document.querySelectorAll("[data-exam-review]").forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.student);ensure(s);s.exams[el.dataset.examReview].reviewStatus=el.value;save(db)});document.querySelectorAll("[data-loc-week]").forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.student);ensure(s);s.weeks[el.dataset.locWeek].localizationEvidence=el.value;save(db)});document.querySelectorAll("[data-save-loc]").forEach(btn=>btn.onclick=()=>{const s=db.students.find(x=>x.id===btn.dataset.saveLoc);ensure(s);s.localization.statePack=document.querySelector(`[data-pack="${s.id}"]`).value;s.localization.stateLabel=document.querySelector(`[data-label="${s.id}"]`).value.trim();s.localization.updatedAt=new Date().toISOString();save(db);render()});$("#export").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kindergarten-social-studies-backup.json";a.click();URL.revokeObjectURL(a.href)};$("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(key(),JSON.stringify(JSON.parse(r.result)));render()}catch{alert("Invalid JSON.")}};r.readAsText(f)};$("#print").onclick=()=>window.print()}$("#open").onclick=()=>{if($("#code").value!=="KHAEKSS")return alert("Incorrect convenience code.");render()}})();
</script></body></html>
