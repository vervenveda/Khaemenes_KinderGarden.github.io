<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy · Kindergarten Social Studies Teacher Tools</title><style>
body{margin:0;background:#f5f1e7;color:#23352d;font:400 15px/1.6 "Avenir Next","Segoe UI",Arial,sans-serif}.shell{width:min(1240px,calc(100% - 28px));margin:auto;padding:28px 0}.card{background:#fff;border:1px solid #d7dcd7;border-radius:7px;padding:18px;margin:14px 0}.button,button,input,select{min-height:40px;padding:8px 12px;border:1px solid #aeb8b2;border-radius:7px;background:#fff;color:#23352d}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7dcd7;padding:7px;text-align:left;vertical-align:top}h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:400}.small{color:#68736d;font-size:12.5px}.assessmentBanner{padding:12px;border:1px solid #cdd8d1;border-radius:7px;background:#f4f8f4;margin:10px 0}@media(max-width:800px){table{display:block;overflow:auto}}@media print{.noPrint{display:none}}
</style></head><body><main class="shell"><div class="actions noPrint"><a class="button" href="index.html">← Student Course</a></div><h1>Khaemenes Academy</h1><h2>Kindergarten Social Studies · Teacher Tools</h2><section class="card"><p><strong>Static-site boundary:</strong> this convenience code is not secure authentication. Backups are course-identified and learner-scoped when an Academy learner is active.</p><label>Convenience code <input id="code" type="password"> <button id="open">Open</button></label></section><div id="tools"></div></main>
<script src="https://vervenveda.com/Khaemenes_Academy.github.io/assets/khaemenes-family-registry.js"></script>
<script src="khaemenes-kindergarten-subject-context.js"></script><script src="course-data.js"></script><script>
(()=>{
 const C=window.KHAEMENES_KINDERGARTEN_SOCIAL_STUDIES,M=C.metadata,SUB=window[Object.keys(window).find(k=>/^Khaemenes.*SubjectContext$/.test(k))]||null,$=s=>document.querySelector(s);
 function key(){return SUB?.scopedKey?.("social-studies")||M.storageKey}
 function academy(){return SUB?.status?.("social-studies")||null}
 function load(){try{return JSON.parse(localStorage.getItem(key()))||{students:[],activeId:null}}catch{return{students:[],activeId:null}}}
 function save(db){localStorage.setItem(key(),JSON.stringify(db))}
 function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
 function ensure(s){s.weeks||={};s.exams||={};s.localization||={statePack:"generic",stateLabel:"",updatedAt:null};for(const k of ["midterm","final"]){s.exams[k]||={best:0,attempts:[]};s.exams[k].attempts||=[];s.exams[k].best=s.exams[k].best||0;s.exams[k].reviewStatus??="pending";s.exams[k].constructedResponse??=""}for(let w=1;w<=36;w++){s.weeks[w]||={};s.weeks[w].attempts||=[];s.weeks[w].reviewStatus??="pending";s.weeks[w].localizationEvidence??="";s.weeks[w].constructedResponse??="";s.weeks[w].correction??="";s.weeks[w].artifact??=""}}
 function visible(db){const a=academy();if(a?.status!=="ready")return db.students||[];const id=a.learner.learnerId;return(db.students||[]).filter(s=>s.academyLearnerId===id||s.id==="academy_"+id)}
 function reviewSelect(value,attrs){const vals=[["pending","Pending"],["observed","Observed"],["meets","Meets evidence standard"],["revise","Revise"]];return `<select ${attrs}>${vals.map(([v,l])=>`<option value="${v}" ${value===v?"selected":""}>${l}</option>`).join("")}</select>`}
 function packOptions(selected){const keys=["generic",...Object.keys(M.statePacks||{})];return keys.map(k=>`<option value="${esc(k)}" ${selected===k?"selected":""}>${k==="generic"?"Generic state/local":k.charAt(0).toUpperCase()+k.slice(1)+" pack"}</option>`).join("")}
 function scopedExport(db){const a=academy();if(a?.status!=="ready")return db;const students=visible(db);return{students,activeId:students[0]?.id||null}}
 function makePayload(){const db=load(),a=academy();return{schema:"khaemenes-social-studies-backup-v2",courseId:M.courseId,grade:M.grade??"K",subject:"social-studies",exportedAt:new Date().toISOString(),scope:a?.status==="ready"?{mode:"academy",academyLearnerId:a.learner.learnerId,nickname:a.learner.nickname}:{mode:"local"},data:scopedExport(db)}}
 function validateDb(d){if(!d||typeof d!=="object"||!Array.isArray(d.students))throw new Error("Backup does not contain a valid students array.");return d}
 function prepareImport(raw){
   const p=raw?.schema?raw:{schema:"legacy",data:raw};
   if(p.courseId&&p.courseId!==M.courseId)throw new Error("This backup belongs to a different course.");
   const incoming=validateDb(p.data),a=academy();
   if(a?.status==="ready"){
     const expected=a.learner.learnerId;
     if(p.scope?.academyLearnerId&&p.scope.academyLearnerId!==expected)throw new Error("This backup belongs to a different Academy learner.");
     const matches=incoming.students.filter(s=>s.academyLearnerId===expected||s.id==="academy_"+expected);
     if(matches.length===1){const s=JSON.parse(JSON.stringify(matches[0]));s.academyLearnerId=expected;s.id="academy_"+expected;s.name=a.learner.nickname;ensure(s);return{students:[s],activeId:s.id}}
     if(matches.length>1)throw new Error("Backup contains duplicate records for the active Academy learner.");
     if(incoming.students.length===1&&!incoming.students[0].academyLearnerId){
       if(!confirm("Legacy backup has no Academy learner identity. Bind its single learner record to the active Academy profile?"))throw new Error("Import cancelled.");
       const s=JSON.parse(JSON.stringify(incoming.students[0]));s.academyLearnerId=expected;s.id="academy_"+expected;s.name=a.learner.nickname;ensure(s);return{students:[s],activeId:s.id}
     }
     throw new Error("Import blocked: no uniquely matching record for the active Academy learner.");
   }
   const names=incoming.students.map(s=>s.name||"(unnamed)").join(", ");
   if(!confirm(`Import ${incoming.students.length} local learner record(s): ${names||"none"}? This replaces the current local Social Studies record.`))throw new Error("Import cancelled.");
   incoming.students.forEach(ensure);return incoming;
 }
 function render(){
   const db=load();(db.students||[]).forEach(ensure);const students=visible(db);
   const cards=students.map(s=>{
     const mastered=C.weeks.filter(w=>(s.weeks[w.week]?.best||0)>=M.masteryThreshold).length;
     const reviewed=C.weeks.filter(w=>s.weeks[w.week]?.reviewStatus==="meets").length;
     const rows=C.weeks.map(w=>{const r=s.weeks[w.week]||{},loc=M.localizationCheckpoints?.includes(w.week)?esc((r.localizationEvidence||"").slice(0,100)):"—";return`<tr><td>${w.week}</td><td>${esc(w.title)}</td><td>${r.best?r.best+"%":"—"}</td><td>${r.attempts?.length||0}</td><td>${esc((r.constructedResponse||"").slice(0,100))}</td><td>${reviewSelect(r.reviewStatus,`data-week-review="${w.week}" data-student="${s.id}"`)}</td><td>${loc}</td><td>${esc((r.correction||"").slice(0,75))}</td></tr>`}).join("");
     return`<section class="card"><h2>${esc(s.name)} · ${mastered}/36 objective gates mastered · ${reviewed}/36 written/evidence reviews meeting standard</h2>
       <div class="assessmentBanner"><h3>State/local context</h3><label>Pack <select data-pack="${s.id}">${packOptions(s.localization.statePack||"generic")}</select></label> <label>State/local label <input data-state-label="${s.id}" value="${esc(s.localization.stateLabel||"")}" placeholder="State · County/Community"></label> <button data-save-localization="${s.id}">Save localization</button><p class="small">Localization is required at checkpoint weeks and never changes the ${M.masteryThreshold}% national-core mastery gate.</p></div>
       <div class="assessmentBanner"><strong>Midterm response · ${reviewSelect(s.exams.midterm.reviewStatus,`data-exam-review="midterm" data-student="${s.id}"`)}</strong><p>${esc((s.exams.midterm.constructedResponse||"Not yet saved").slice(0,650))}</p><strong>Final response · ${reviewSelect(s.exams.final.reviewStatus,`data-exam-review="final" data-student="${s.id}"`)}</strong><p>${esc((s.exams.final.constructedResponse||"Not yet saved").slice(0,650))}</p></div>
       <table><tr><th>Week</th><th>Topic</th><th>Best</th><th>Attempts</th><th>Constructed/Evidence Response</th><th>Teacher Review</th><th>Localization Evidence</th><th>Correction</th></tr>${rows}</table></section>`;
   }).join("");
   $("#tools").innerHTML=`<section class="card noPrint"><div class="actions"><button id="export">Export scoped JSON</button><label class="button">Import protected JSON <input id="import" style="display:none" type="file" accept=".json,application/json"></label><button id="printBtn">Print</button></div><p class="small">Imports are course-checked. With an active Academy profile, another learner's backup is rejected. Legacy multi-learner backups cannot overwrite a scoped profile.</p></section>${cards||'<section class="card">No visible subject learner stored in this browser/context.</section>'}`;
   $("#export").onclick=()=>{const b=new Blob([JSON.stringify(makePayload(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(M.courseId||"social-studies")+"-backup.json";a.click();URL.revokeObjectURL(a.href)};
   $("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const next=prepareImport(JSON.parse(r.result));save(next);render();alert("Protected import complete.")}catch(err){alert(err.message||"Import blocked.")}};r.readAsText(f)};
   $("#printBtn").onclick=()=>window.print();
   document.querySelectorAll("[data-week-review]").forEach(el=>el.onchange=e=>{const db=load(),s=(db.students||[]).find(x=>x.id===e.target.dataset.student);if(!s)return;ensure(s);s.weeks[e.target.dataset.week].reviewStatus=e.target.value;save(db)});
   document.querySelectorAll("[data-exam-review]").forEach(el=>el.onchange=e=>{const db=load(),s=(db.students||[]).find(x=>x.id===e.target.dataset.student);if(!s)return;ensure(s);s.exams[e.target.dataset.examReview].reviewStatus=e.target.value;save(db)});
   document.querySelectorAll("[data-save-localization]").forEach(btn=>btn.onclick=e=>{const db=load(),id=e.target.dataset.saveLocalization,s=(db.students||[]).find(x=>x.id===id);if(!s)return;ensure(s);s.localization.statePack=document.querySelector(`[data-pack="${CSS.escape(id)}"]`).value;s.localization.stateLabel=document.querySelector(`[data-state-label="${CSS.escape(id)}"]`).value.trim();s.localization.updatedAt=new Date().toISOString();save(db);alert("Localization context saved.")});
 }
 $("#open").onclick=()=>{if($("#code").value!=="KHAEKSS")return alert("Incorrect convenience code.");render()};
})();
</script><script src="https://vervenveda.com/assets/vnv-ecosystem-toolbar.js"></script>
</body></html>
