<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy · Kindergarten Social Studies Teacher Tools</title><style>body{margin:0;background:#f6f1e7;color:#20312a;font:400 16px/1.6 "Avenir Next","Segoe UI",sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px}.card{background:#fff;border:1px solid #d8ddd7;border-radius:7px;padding:20px;margin:12px 0}h1,h2{font-family:Georgia,serif;font-weight:400}button,a{display:inline-block;padding:9px 13px;border:1px solid #aebbb4;border-radius:7px;background:#fff;color:#20312a;text-decoration:none;cursor:pointer}input{font:inherit;padding:8px;border:1px solid #ccd4cf;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd;text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="shell"><div class="actions"><a href="index.html">← Student Course</a><a href="../index.html">Kinder Garden Home</a></div><h1>Khaemenes Academy</h1><h2>Kindergarten Social Studies · Teacher Tools</h2><div class="card"><p><strong>Authority boundary:</strong> this static page is a local teacher convenience tool, not secure authentication. It can inspect/export the learner record and does not fabricate mastery scores.</p><label>Teacher convenience passcode <input id="code" type="password"><button id="open">Open</button></label></div><div id="tools"></div></main><script src="course-data.js"></script><script>
(()=>{
  const C=window.KHAEMENES_KINDERGARTEN_SOCIAL_STUDIES;
  const K=C.metadata.storageKey;
  const $=s=>document.querySelector(s);
  function load(){try{return JSON.parse(localStorage.getItem(K))||{students:[]}}catch{return{students:[]}}}
  function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
  function render(){
    const db=load();
    const cards=(db.students||[]).map(s=>{
      s.weeks||={};
      let mastered=0;
      for(let w=1;w<=36;w++) if((s.weeks[w]?.best||0)>=80) mastered++;
      const rows=C.weeks.map(w=>{
        const r=s.weeks[w.week]||{};
        return `<tr><td>${w.week}</td><td>${esc(w.title)}</td><td>${r.best?r.best+"%":"—"}</td><td>${r.attempts?.length||0}</td><td>${esc((r.artifact||"").slice(0,80))}</td></tr>`;
      }).join("");
      return `<div class="card"><h2>${esc(s.name)} · ${mastered}/36 mastered</h2><table><tr><th>Week</th><th>Topic</th><th>Best</th><th>Attempts</th><th>Portfolio</th></tr>${rows}</table></div>`;
    }).join("");
    $("#tools").innerHTML=`<div class="card"><div class="actions"><button id="export">Export JSON Backup</button><label>Import JSON <input id="import" type="file" accept=".json,application/json"></label><button id="printBtn">Print</button></div></div>${cards||'<div class="card">No local learner records yet.</div>'}`;
    $("#export").onclick=()=>{const blob=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kindergarten-social-studies-backup.json";a.click();URL.revokeObjectURL(a.href)};
    $("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(K,JSON.stringify(JSON.parse(r.result)));render();alert("Backup imported.")}catch{alert("Invalid JSON backup.")}};r.readAsText(f)};
    $("#printBtn").onclick=()=>window.print();
  }
  $("#open").onclick=()=>{if($("#code").value!=="KHAEKSS")return alert("Incorrect convenience code.");render()};
})();
</script></body></html>
