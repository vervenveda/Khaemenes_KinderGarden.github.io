<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindergarten Social Studies Printable</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="padding:24px 0"><div class="actions noPrint"><a class="button" id="back" href="index.html">← Course</a><button onclick="window.print()">Print</button></div><div id="page"></div></main><script src="course-data.js"></script><script>
(()=>{const C=window.KHAEMENES_KINDERGARTEN_SOCIAL_STUDIES,w=Math.min(36,Math.max(1,Number(new URLSearchParams(location.search).get("week"))||1)),x=C.weeks[w-1],e=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),vv=v=>typeof v==="string"?e(v):`${e(v.term)} — ${e(v.definition)}`;document.title=`Kindergarten Social Studies · Week ${w} Printable`;document.querySelector("#back").href=`index.html?week=${w}`;document.querySelector("#page").innerHTML=`<section class="card"><p class="eyebrow">Khaemenes Academy · Kindergarten Social Studies · Week ${w}</p><h1 style="font-size:38px">${e(x.title)}</h1><p><strong>Unit:</strong> ${e(x.unit||"")}</p><p><strong>Essential Question:</strong> ${e(x.essentialQuestion)}</p><p>${e(x.keyIdea)}</p><h2>Words to Know</h2><ul>${(x.vocabulary||[]).map(v=>`<li>${vv(v)}</li>`).join("")}</ul></section><section class="card"><h2>Five-Day Learning Path</h2>${(x.lessons||[]).map(l=>`<div class="lesson"><h3>${e(l.day)} · ${e(l.title)}</h3><p><strong>Objective:</strong> ${e(l.objective)}</p><p>${e(l.activity)}</p><p><strong>Evidence:</strong> ${e(l.evidence)}</p></div>`).join("")}</section><section class="card"><h2>Draw, Tell, or Write What You Learned</h2><div style="height:280px;background:repeating-linear-gradient(#fff,#fff 31px,#ddd 32px)"></div></section>`;})();
</script></body></html>
