<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🌈 Math Garden Adventure — 1st Grade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg1:#ffecd2; --bg2:#fcb69f; --panel:#ffffff;
  --accent:#7c3aed; --happy:#22c55e; --warn:#f97316;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"Comic Sans MS","Arial Rounded MT Bold",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  display:flex; justify-content:center; align-items:center; min-height:100vh;
}
#app{
  background:var(--panel); border-radius:30px; padding:20px;
  width:95%; max-width:520px; box-shadow:0 20px 40px rgba(0,0,0,.2); text-align:center;
}
h1{margin:0 0 10px;color:var(--accent);}
#garden{font-size:48px;margin:10px 0;}
#focus{margin:10px 0;font-size:18px;}
#card{background:#fff7ed;border:4px dashed var(--accent);border-radius:20px;padding:20px;margin:15px 0;font-size:28px; min-height:80px;}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
button{font-size:22px;padding:14px;border:none;border-radius:16px;cursor:pointer;background:#fde68a;}
button:hover{background:#fcd34d;}
#message{margin-top:15px;font-size:20px;min-height:28px;}
#stars{margin-top:8px;font-size:22px;}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;}
</style>
</head>
<body>
<div id="app">
  <h1>🌈 Math Garden Adventure</h1>
  <div id="garden">🌱</div>
  <div id="focus">Focus Meter: 🐢</div>
  <div id="card">Loading…</div>
  <div class="answers" id="answers"></div>
  <div id="message"></div>
  <div id="stars">⭐ 0</div>
</div>

<script>
(() => {
"use strict";

/* -------------------------
   STATE
-------------------------- */
let stars=0, streak=0, focus=2;

/* -------------------------
   RANDOM HELPER
-------------------------- */
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

/* -------------------------
   CHALLENGE BANK (50)
-------------------------- */
const CHALLENGES=[
  // COUNTING 1–10
  {type:"count",min:1,max:3,reward:3},{type:"count",min:1,max:5,reward:3},{type:"count",min:2,max:5,reward:4},
  {type:"count",min:3,max:6,reward:4},{type:"count",min:1,max:7,reward:4},{type:"count",min:4,max:8,reward:4},
  {type:"count",min:1,max:10,reward:5},{type:"count",min:5,max:10,reward:5},{type:"count",min:6,max:10,reward:5},
  {type:"count",min:7,max:10,reward:5},

  // ADDITION 1–10
  {type:"add",min:1,max:3,reward:4},{type:"add",min:2,max:4,reward:4},{type:"add",min:1,max:5,reward:5},
  {type:"add",min:3,max:5,reward:5},{type:"add",min:2,max:6,reward:5},{type:"add",min:1,max:7,reward:5},
  {type:"add",min:4,max:6,reward:5},{type:"add",min:5,max:7,reward:5},{type:"add",min:1,max:8,reward:5},
  {type:"add",min:2,max:9,reward:5},

  // SUBTRACTION 1–10
  {type:"sub",min:2,max:5,reward:4},{type:"sub",min:3,max:6,reward:4},{type:"sub",min:4,max:7,reward:4},
  {type:"sub",min:5,max:8,reward:4},{type:"sub",min:6,max:9,reward:5},{type:"sub",min:7,max:10,reward:5},
  {type:"sub",min:3,max:9,reward:4},{type:"sub",min:1,max:5,reward:4},{type:"sub",min:1,max:6,reward:4},
  {type:"sub",min:1,max:7,reward:5},

  // COUNTING 11–20
  {type:"count",min:11,max:15,reward:5},{type:"count",min:12,max:18,reward:5},{type:"count",min:13,max:20,reward:6},
  {type:"count",min:14,max:20,reward:6},{type:"count",min:15,max:20,reward:6},{type:"count",min:10,max:20,reward:6},
  {type:"count",min:16,max:20,reward:6},{type:"count",min:17,max:20,reward:6},{type:"count",min:12,max:19,reward:5},
  {type:"count",min:13,max:18,reward:5},

  // ADDITION 11–20
  {type:"add",min:10,max:15,reward:5},{type:"add",min:11,max:17,reward:5},{type:"add",min:12,max:18,reward:6},
  {type:"add",min:13,max:19,reward:6},{type:"add",min:14,max:20,reward:6},{type:"add",min:10,max:20,reward:6},
  {type:"add",min:15,max:20,reward:6},{type:"add",min:12,max:18,reward:5},{type:"add",min:11,max:19,reward:5},
  {type:"add",min:13,max:20,reward:5},

  // SUBTRACTION 11–20
  {type:"sub",min:10,max:15,reward:5},{type:"sub",min:11,max:17,reward:5},{type:"sub",min:12,max:18,reward:6},
  {type:"sub",min:13,max:19,reward:6},{type:"sub",min:14,max:20,reward:6},{type:"sub",min:10,max:20,reward:6},
  {type:"sub",min:15,max:20,reward:6},{type:"sub",min:12,max:18,reward:5},{type:"sub",min:11,max:19,reward:5},
  {type:"sub",min:13,max:20,reward:5}
];

/* -------------------------
   PICK NEXT CHALLENGE
-------------------------- */
function pickChallenge(){
  let best=null,bestScore=Infinity;
  for(let i=0;i<100;i++){
    const c=CHALLENGES[rand(0,CHALLENGES.length-1)];
    const diff=c.max>10?4:2;
    const energyMismatch=Math.abs(diff-focus);
    const score=(6-(c.reward))*1.5 + energyMismatch*2;
    if(score<bestScore){bestScore=score;best=c;}
  }
  return best;
}

/* -------------------------
   GENERATE PROBLEM
-------------------------- */
function generate(){
  const c=pickChallenge();
  let question, answer, images=[];

  if(c.type==="count"){
    answer=rand(c.min,c.max);
    question=`How many apples? 🍎`;
    for(let i=0;i<answer;i++){images.push("🍎");}
  }
  if(c.type==="add"){
    const a=rand(1,c.max),b=rand(1,c.max);
    answer=a+b;
    question=`${a} + ${b} = ?`;
    for(let i=0;i<a;i++){images.push("🍎");}
    images.push("+");
    for(let i=0;i<b;i++){images.push("🍎");}
  }
  if(c.type==="sub"){
    const a=rand(c.min,c.max),b=rand(1,a);
    answer=a-b;
    question=`${a} − ${b} = ?`;
    for(let i=0;i<a;i++){images.push("🍎");}
  }

  return {question,answer,images};
}

/* -------------------------
   RENDER
-------------------------- */
function render(){
  const prob=generate();
  const card=document.getElementById("card");
  card.innerHTML=prob.question+"<div>"+prob.images.join(" ")+"</div>";

  const correct=prob.answer;
  const opts=new Set([correct]);
  while(opts.size<4){opts.add(Math.max(0,correct+rand(-3,3)));}
  const arr=[...opts].sort(()=>Math.random()-.5);

  const box=document.getElementById("answers");
  box.innerHTML="";
  arr.forEach(v=>{
    const b=document.createElement("button");
    b.textContent=v;
    b.onclick=()=>check(v===correct);
    box.appendChild(b);
  });
}

/* -------------------------
   FEEDBACK LOOP
-------------------------- */
function check(ok){
  const msg=document.getElementById("message");
  if(ok){
    stars++; streak++; focus=Math.min(5,focus+0.2);
    msg.textContent="🎉 Great job!";
    confetti();
  }else{
    streak=0; focus=Math.max(1,focus-0.4);
    msg.textContent="🌼 Nice try! Keep going!";
  }
  updateGarden();
  render();
}

/* -------------------------
   GARDEN PROGRESSION
-------------------------- */
function updateGarden(){
  const g=document.getElementById("garden");
  if(stars<5) g.textContent="🌱";
  else if(stars<10) g.textContent="🌷";
  else if(stars<20) g.textContent="🌻";
  else g.textContent="🌳";

  document.getElementById("stars").textContent=`⭐ ${stars}`;
  const icons=["🐢","🐢","🙂","🚀","🚀"];
  document.getElementById("focus").textContent="Focus Meter: "+icons[Math.round(focus)-1];
}

/* -------------------------
   CONFETTI
-------------------------- */
function confetti(){
  const colors=["#f43f5e","#facc15","#22c55e","#3b82f6"];
  for(let i=0;i<30;i++){
    const div=document.createElement("div");
    div.className="confetti-piece";
    div.style.background=colors[rand(0,colors.length-1)];
    div.style.left=rand(0,window.innerWidth)+"px";
    div.style.top=rand(0,window.innerHeight/2)+"px";
    document.body.appendChild(div);
    let angle=rand(0,360);
    let speed=rand(2,6);
    let gravity=0.5;
    let y=parseFloat(div.style.top);
    let x=parseFloat(div.style.left);
    const fall=()=>{
      y+=speed; x+=Math.sin(angle)*2; speed+=gravity;
      div.style.top=y+"px"; div.style.left=x+"px";
      if(y<window.innerHeight){requestAnimationFrame(fall);}
      else{div.remove();}
    };
    fall();
  }
}

/* -------------------------
   START
-------------------------- */
render();

})();
</script>
</body>
</html>
