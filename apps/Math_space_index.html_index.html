<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🪐 Space Math Adventure – 4th Grade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg1:#0b0f1a;
  --bg2:#1a1f3a;
  --panel:#14182b;
  --accent:#7c3aed;
  --happy:#22c55e;
  --warn:#f97316;
}

*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"Comic Sans MS","Arial Rounded MT Bold",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

#app{
  background:var(--panel);
  border-radius:20px;
  padding:20px;
  width:95%;
  max-width:600px;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
  text-align:center;
}

h1{
  margin:0 0 10px;
  color: #FDF8BB;
}

#level{margin:5px;font-size:16px;}
#stars{margin:5px;font-size:18px;}
#card{
  background:#1f243e;
  border-radius:12px;
  padding:15px;
  margin:15px 0;
  font-size:20px;
}
#manipulatives{
  margin:10px 0;
  font-size:32px;
}
.answers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
button{
  font-size:20px;
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#fde68a;
  color:#000;
}
button:hover{background:#fcd34d;}
#message{margin-top:12px;min-height:28px;}
</style>
</head>

<body>
<div id="app">
  <h1>🪐 Space Math Adventure</h1>
  <div id="level">Level: 1 – Counting Stars</div>
  <div id="stars">⭐ 0</div>
  <div id="card">Loading…</div>
  <div id="manipulatives"></div>
  <div class="answers" id="answers"></div>
  <div id="message"></div>
</div>

<script>
(() => {
"use strict";

/* -------------------------
   GAME STATE
-------------------------- */
let stars=0;
let streak=0;
let level=1;
let currentChallenge=null;

/* -------------------------
   VISUALS
-------------------------- */
const visualMap={
  "rocket":"🚀",
  "planets":"🪐",
  "stars":"⭐",
  "comets":"☄️",
  "meteors":"🌠",
  "moon":"🌙"
};

/* -------------------------
   SAFE RANDOM
-------------------------- */
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

/* -------------------------
   50 CHALLENGES
-------------------------- */
const CHALLENGES=[
  // Level 1 – Counting (1–10)
  {level:1,type:"count",question:"Count the stars",answer:3,min:1,max:5,visual:"stars",reward:3},
  {level:1,type:"count",question:"How many planets do you see?",answer:5,min:1,max:5,visual:"planets",reward:3},
  {level:1,type:"count",question:"Count the comets!",answer:4,min:1,max:5,visual:"comets",reward:4},
  {level:1,type:"count",question:"How many rockets are flying?",answer:2,min:1,max:5,visual:"rocket",reward:4},
  {level:1,type:"count",question:"Count the moons",answer:5,min:1,max:5,visual:"moon",reward:4},
  {level:1,type:"count",question:"Count all the stars",answer:6,min:1,max:6,visual:"stars",reward:4},
  {level:1,type:"count",question:"How many comets?",answer:7,min:3,max:7,visual:"comets",reward:4},
  {level:1,type:"count",question:"Count the planets in view",answer:5,min:1,max:6,visual:"planets",reward:4},
  {level:1,type:"count",question:"How many rockets?",answer:3,min:1,max:5,visual:"rocket",reward:4},
  {level:1,type:"count",question:"Count the moons in the sky",answer:4,min:1,max:5,visual:"moon",reward:4},

  // Level 2 – Addition
  {level:2,type:"add",question:"2 + 3 = ?",a:2,b:3,answer:5,visual:"stars",reward:4},
  {level:2,type:"add",question:"4 + 5 = ?",a:4,b:5,answer:9,visual:"planets",reward:4},
  {level:2,type:"add",question:"6 + 4 = ?",a:6,b:4,answer:10,visual:"comets",reward:5},
  {level:2,type:"add",question:"3 + 7 = ?",a:3,b:7,answer:10,visual:"rocket",reward:5},
  {level:2,type:"add",question:"5 + 5 = ?",a:5,b:5,answer:10,visual:"moon",reward:5},
  {level:2,type:"add",question:"1 + 9 = ?",a:1,b:9,answer:10,visual:"stars",reward:5},
  {level:2,type:"add",question:"7 + 2 = ?",a:7,b:2,answer:9,visual:"planets",reward:5},
  {level:2,type:"add",question:"3 + 6 = ?",a:3,b:6,answer:9,visual:"comets",reward:5},
  {level:2,type:"add",question:"4 + 4 = ?",a:4,b:4,answer:8,visual:"rocket",reward:4},
  {level:2,type:"add",question:"2 + 7 = ?",a:2,b:7,answer:9,visual:"moon",reward:4},

  // Level 3 – Subtraction
  {level:3,type:"sub",question:"5 − 2 = ?",a:5,b:2,answer:3,visual:"stars",reward:4},
  {level:3,type:"sub",question:"10 − 4 = ?",a:10,b:4,answer:6,visual:"planets",reward:5},
  {level:3,type:"sub",question:"8 − 3 = ?",a:8,b:3,answer:5,visual:"comets",reward:4},
  {level:3,type:"sub",question:"7 − 5 = ?",a:7,b:5,answer:2,visual:"rocket",reward:4},
  {level:3,type:"sub",question:"9 − 4 = ?",a:9,b:4,answer:5,visual:"moon",reward:5},
  {level:3,type:"sub",question:"6 − 2 = ?",a:6,b:2,answer:4,visual:"stars",reward:4},
  {level:3,type:"sub",question:"5 − 1 = ?",a:5,b:1,answer:4,visual:"planets",reward:4},
  {level:3,type:"sub",question:"8 − 5 = ?",a:8,b:5,answer:3,visual:"comets",reward:4},
  {level:3,type:"sub",question:"9 − 7 = ?",a:9,b:7,answer:2,visual:"rocket",reward:4},
  {level:3,type:"sub",question:"7 − 3 = ?",a:7,b:3,answer:4,visual:"moon",reward:4},

  // Level 4 – Fractions
  {level:4,type:"frac",question:"1/2 of the stars are red",numerator:1,denominator:2,visual:"stars",answer:1,reward:5},
  {level:4,type:"frac",question:"1/3 of the comets are bright",numerator:1,denominator:3,visual:"comets",answer:1,reward:5},
  {level:4,type:"frac",question:"2/4 of the planets are blue",numerator:2,denominator:4,visual:"planets",answer:2,reward:5},
  {level:4,type:"frac",question:"3/5 of the rockets are moving fast",numerator:3,denominator:5,visual:"rocket",answer:3,reward:5},
  {level:4,type:"frac",question:"1/2 of the moons are full",numerator:1,denominator:2,visual:"moon",answer:1,reward:5},
  {level:4,type:"frac",question:"2/3 of the stars are twinkling",numerator:2,denominator:3,visual:"stars",answer:2,reward:5},
  {level:4,type:"frac",question:"3/4 of the comets are icy",numerator:3,denominator:4,visual:"comets",answer:3,reward:5},
  {level:4,type:"frac",question:"1/3 of the planets are green",numerator:1,denominator:3,visual:"planets",answer:1,reward:5},
  {level:4,type:"frac",question:"2/5 of the rockets are red",numerator:2,denominator:5,visual:"rocket",answer:2,reward:5},
  {level:4,type:"frac",question:"1/2 of the moons are small",numerator:1,denominator:2,visual:"moon",answer:1,reward:5},

  // Level 5 – Area/Perimeter
  {level:5,type:"area",question:"A rectangle is 3x4 units. Area = ?",answer:12,unit:"units²",reward:5},
  {level:5,type:"area",question:"A rectangle is 5x6 units. Area = ?",answer:30,unit:"units²",reward:5},
  {level:5,type:"peri",question:"A rectangle is 4x5 units. Perimeter = ?",answer:18,unit:"units",reward:5},
  {level:5,type:"peri",question:"A rectangle is 6x7 units. Perimeter = ?",answer:26,unit:"units",reward:5},
  {level:5,type:"area",question:"A rectangle is 2x9 units. Area = ?",answer:18,unit:"units²",reward:5},
  {level:5,type:"peri",question:"A rectangle is 3x8 units. Perimeter = ?",answer:22,unit:"units",reward:5},
  {level:5,type:"area",question:"A rectangle is 7x3 units. Area = ?",answer:21,unit:"units²",reward:5},
  {level:5,type:"peri",question:"A rectangle is 5x5 units. Perimeter = ?",answer:20,unit:"units",reward:5},
  {level:5,type:"area",question:"A rectangle is 6x2 units. Area = ?",answer:12,unit:"units²",reward:5},
  {level:5,type:"peri",question:"A rectangle is 4x6 units. Perimeter = ?",answer:20,unit:"units",reward:5},

  // Level 6 – Word Problems
  {level:6,type:"word",question:"If 5 rockets and 3 comets fly, how many in total?",answer:8,reward:5},
  {level:6,type:"word",question:"You see 4 moons and 6 stars. Total?",answer:10,reward:5},
  {level:6,type:"word",question:"2 planets plus 7 meteors = ?",answer:9,reward:5},
  {level:6,type:"word",question:"3 rockets + 5 stars = ?",answer:8,reward:5},
  {level:6,type:"word",question:"6 comets + 4 moons = ?",answer:10,reward:5},
  {level:6,type:"word",question:"5 stars + 5 planets = ?",answer:10,reward:5},
  {level:6,type:"word",question:"3 moons + 7 rockets = ?",answer:10,reward:5},
  {level:6,type:"word",question:"2 comets + 8 stars = ?",answer:10,reward:5},
  {level:6,type:"word",question:"4 planets + 6 comets = ?",answer:10,reward:5},
  {level:6,type:"word",question:"5 moons + 3 rockets = ?",answer:8,reward:5}
];

/* -------------------------
   SELECT NEXT CHALLENGE
-------------------------- */
function pickChallenge(){
  // Only show challenges for unlocked level (stars thresholds)
  const unlockedLevel=Math.min(level,6);
  const available=CHALLENGES.filter(c=>c.level<=unlockedLevel);
  return available[rand(0,available.length-1)];
}

/* -------------------------
   GENERATE PROBLEM
-------------------------- */
function generate(){
  currentChallenge=pickChallenge();
  const card=document.getElementById("card");
  const manip=document.getElementById("manipulatives");
  const answersDiv=document.getElementById("answers");
  card.textContent=currentChallenge.question;
  manip.innerHTML="";
  answersDiv.innerHTML="";

  // Drag-to-count or fraction visual
  if(currentChallenge.type==="count"){
    const emoji=visualMap[currentChallenge.visual]||"🚀";
    for(let i=0;i<currentChallenge.answer;i++){
      const span=document.createElement("span");
      span.textContent=emoji;
      manip.appendChild(span);
    }
    for(let i=currentChallenge.min;i<=currentChallenge.max;i++){
      const btn=document.createElement("button");
      btn.textContent=i;
      btn.onclick=()=>checkAnswer(i);
      answersDiv.appendChild(btn);
    }
  } else if(currentChallenge.type==="frac"){
    const emoji=visualMap[currentChallenge.visual]||"🪐";
    for(let i=0;i<currentChallenge.denominator;i++){
      const span=document.createElement("span");
      span.textContent=i<currentChallenge.numerator?emoji:"⚪";
      manip.appendChild(span);
    }
    for(let i=1;i<=currentChallenge.denominator;i++){
      const btn=document.createElement("button");
      btn.textContent=i;
      btn.onclick=()=>checkAnswer(i);
      answersDiv.appendChild(btn);
    }
  } else if(["add","sub","area","peri","word"].includes(currentChallenge.type)){
    const correct=currentChallenge.answer;
    const opts=new Set([correct]);
    while(opts.size<4){opts.add(correct+rand(-3,3));}
    [...opts].sort(()=>Math.random()-.5).forEach(v=>{
      const b=document.createElement("button");
      b.textContent=v;
      b.onclick=()=>checkAnswer(v);
      answersDiv.appendChild(b);
    });
  }
}

/* -------------------------
   CHECK ANSWER
-------------------------- */
function checkAnswer(val){
  const msg=document.getElementById("message");
  if(val===currentChallenge.answer){
    stars++;
    streak++;
    msg.textContent="🎉 Correct!";
  } else {
    streak=0;
    msg.textContent="❌ Try again!";
  }

  // Level progression
  if(stars>=10 && level<6){level++;}

  document.getElementById("stars").textContent=`⭐ ${stars}`;
  document.getElementById("level").textContent=`Level: ${level} – ${currentChallenge.type.charAt(0).toUpperCase()+currentChallenge.type.slice(1)}`;
  generate();
}

/* -------------------------
   START
-------------------------- */
generate();
})();
</script>
</body>
</html>
